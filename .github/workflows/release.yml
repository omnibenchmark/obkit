name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-python:
    name: Build Python sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build
        run: python -m pip install --upgrade build
      - name: Build
        working-directory: python
        run: python -m build
      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: python
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg_version=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$tag" != "$pkg_version" ]; then
            echo "Tag v$tag does not match pyproject version $pkg_version" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python/dist/

  build-r:
    name: Build R source tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/obkit
          extra-packages: any::rcmdcheck
      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: r/obkit
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg_version=$(grep '^Version:' DESCRIPTION | awk '{print $2}')
          if [ "$tag" != "$pkg_version" ]; then
            echo "Tag v$tag does not match DESCRIPTION version $pkg_version" >&2
            exit 1
          fi
      - name: R CMD build
        run: R CMD build r/obkit
      - name: R CMD check
        run: R CMD check --no-manual --as-cran obkit_*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: r-dist
          path: obkit_*.tar.gz

  publish-pypi:
    name: Publish to PyPI
    needs: build-python
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/obkit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: [build-python, build-r]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: artifacts/python/
      - uses: actions/download-artifact@v4
        with:
          name: r-dist
          path: artifacts/r/
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/python/*
            artifacts/r/*
