context:
  name: obkit
  version: ${{ env.get("OBKIT_VERSION", default="0.0.0.dev0") }}

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  path: ../../python
  use_gitignore: true

build:
  noarch: python
  number: 0
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=68
  run:
    - python >=3.9

tests:
  - python:
      imports:
        - obkit
        - obkit.logger
        - obkit.prof
      pip_check: true

about:
  homepage: https://github.com/omnibenchmark/obkit
  license: MIT
  license_file: LICENSE
  summary: Utility toolkit for omnibenchmark modules and Snakemake workflows
  description: |
    Pure-stdlib utilities for omnibenchmark workflows: structured JSONL
    lifecycle event logging and profiler alignment helpers.
  repository: https://github.com/omnibenchmark/obkit
